<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/visa-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>visavo.in</title>
  <meta name="description"
    content="Visa & Voyage makes visa applications effortless. Apply for tourist, business, and student visas to 7 countries  Fast, secure, and expert-guided." />
  <meta name="keywords" content="visa application, tourist visa, travel visa, visa booking, visa services" />
  <meta name="author" content="Visa & Voyage Technologies" />
  <meta name="theme-color" content="#f0f2f5" />
  <meta property="og:title" content="Visa & Voyage  Professional Visa Application Platform" />
  <meta property="og:description"
    content="Apply for visas to 7 countries. 98% approval rate. Fast, secure, expert-guided." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-image.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      background-color: var(--bg, #EEDFC7);
    }
  </style>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("visavo_frontend_theme");
        if (!raw) return;
        var t = JSON.parse(raw);
        if (!t || typeof t !== "object") return;
        var def = {
          bg: "#EEDFC7",
          surfaceBg: "#D9CCB4",
          ink: "#2D2B22",
          muted: "#6E6A59",
          accent: "#607938",
          buttonText: "#FFFFFF"
        };
        var up = function (v) { return typeof v === "string" ? v.toUpperCase() : ""; };
        if (
          up(t.bg) === def.bg &&
          up(t.surfaceBg) === def.surfaceBg &&
          up(t.ink) === def.ink &&
          up(t.muted) === def.muted &&
          up(t.accent) === def.accent &&
          up(t.buttonText) === def.buttonText
        ) {
          return;
        }
        var theme = {
          bg: t.bg || def.bg,
          surfaceBg: t.surfaceBg || def.surfaceBg,
          ink: t.ink || def.ink,
          muted: t.muted || def.muted,
          accent: t.accent || def.accent,
          buttonText: t.buttonText || def.buttonText
        };
        var root = document.documentElement;
        var hi = "color-mix(in srgb, " + theme.surfaceBg + " 92%, " + theme.ink + ")";
        var lo = "color-mix(in srgb, " + theme.surfaceBg + " 78%, " + theme.ink + ")";
        var line = "color-mix(in srgb, " + theme.ink + " 16%, transparent)";
        var vars = {
          "--bg": theme.bg,
          "--pbg": theme.bg,
          "--cd": theme.bg,
          "--color-background": theme.bg,
          "--color-surface": theme.bg,
          "--surface-bg": theme.surfaceBg,
          "--surface-2": theme.surfaceBg,
          "--surface-3": theme.surfaceBg,
          "--nb": theme.surfaceBg,
          "--fb": theme.surfaceBg,
          "--color-surface-2": theme.surfaceBg,
          "--color-surface-3": theme.surfaceBg,
          "--ink": theme.ink,
          "--nt": theme.ink,
          "--fth": theme.ink,
          "--color-text-primary": theme.ink,
          "--mu": theme.muted,
          "--ftt": theme.muted,
          "--color-text-secondary": theme.muted,
          "--ac": theme.accent,
          "--acr": theme.accent,
          "--bb": theme.accent,
          "--na": theme.accent,
          "--color-cyan": theme.accent,
          "--color-cyan-dim": "color-mix(in srgb, " + theme.accent + " 82%, #000000)",
          "--bf": theme.buttonText,
          "--hi": hi,
          "--lo": lo,
          "--nl": line,
          "--dp-bg": theme.bg,
          "--dp-surface": theme.surfaceBg,
          "--dp-header-bg": theme.surfaceBg,
          "--dp-ink": theme.ink,
          "--dp-muted": theme.muted,
          "--dp-accent": theme.accent,
          "--dp-light": hi,
          "--dp-dark": lo
        };
        for (var k in vars) {
          root.style.setProperty(k, vars[k]);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
